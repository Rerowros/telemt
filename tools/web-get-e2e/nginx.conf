# GET-only CDN emulation for the telemt WEB carrier E2E fixture.
# Deployments such as object-storage CDNs accept GET only; every other method
# must be rejected at the edge before traffic reaches telemt.

worker_processes 1;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type text/html;
    access_log off;
    server_tokens off;

    # One request line or header line may occupy at most one 8k buffer:
    # URI > 8192 bytes -> 414, header line > 8192 bytes -> 400 (494 mapped).
    client_header_buffer_size 8k;
    large_client_header_buffers 4 8k;

    upstream telemt_get {
        server host.docker.internal:18081;
        keepalive 16;
    }

    # TLS edge for proxy.example.com (self-signed fixture certificate).
    server {
        listen 443 ssl;
        server_name proxy.example.com;

        ssl_certificate     /etc/nginx/certs/proxy.example.com.crt;
        ssl_certificate_key /etc/nginx/certs/proxy.example.com.key;

        # limit_except GET still admits HEAD with GET; deny it explicitly.
        if ($request_method = HEAD) {
            return 405;
        }
        error_page 494 =400 @bad_request;

        location / {
            limit_except GET {
                deny all;
            }
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            # Fixture client address; the real peer is the browser behind the edge.
            proxy_set_header X-Forwarded-For 192.0.2.10;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_connect_timeout 10s;
            proxy_pass http://telemt_get;
        }

        location @bad_request {
            return 400;
        }
    }

    # HTTP parent page at http://127.0.0.1:18000/ that embeds the bridge iframe.
    server {
        listen 18000;
        server_name _;

        if ($request_method = HEAD) {
            return 405;
        }

        location / {
            limit_except GET {
                deny all;
            }
            root /e2e-www;
            try_files /parent.html =404;
        }
    }
}
