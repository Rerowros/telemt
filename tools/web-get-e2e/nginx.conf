# GET-only CDN emulation for the telemt WEB carrier E2E fixture.
# Deployments such as object-storage CDNs accept GET only; every other method
# must be rejected at the edge before traffic reaches telemt.
# Ports: 443 GET-only HTTP/1.1, 8443 GET-only h2, 9443/10443 open-method edges
# used only by the POST baseline bench cells; 18000 serves the parent page.

worker_processes 1;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type text/html;
    access_log off;
    server_tokens off;

    # One request line or header line may occupy at most one 8k buffer:
    # URI > 8192 bytes -> 414, header line > 8192 bytes -> 400 (494 mapped).
    client_header_buffer_size 8k;
    large_client_header_buffers 4 8k;

    # POST baseline cells send bodies around one carrier batch (~2 MiB).
    client_max_body_size 16m;

    upstream telemt_get {
        server host.docker.internal:18081;
        keepalive 16;
    }

    # TLS edge for proxy.example.com (self-signed fixture certificate).
    server {
        listen 443 ssl;
        server_name proxy.example.com;

        ssl_certificate     /etc/nginx/certs/proxy.example.com.crt;
        ssl_certificate_key /etc/nginx/certs/proxy.example.com.key;

        # limit_except GET still admits HEAD with GET; deny it explicitly.
        if ($request_method = HEAD) {
            return 405;
        }
        error_page 494 =400 @bad_request;

        location / {
            limit_except GET {
                deny all;
            }
            include /etc/nginx/edge-proxy.conf;
        }

        location @bad_request {
            return 400;
        }
    }

    # Same GET-only rules over HTTP/2 for carrier-concurrency benchmarks.
    server {
        listen 8443 ssl;
        http2 on;
        server_name proxy.example.com;

        ssl_certificate     /etc/nginx/certs/proxy.example.com.crt;
        ssl_certificate_key /etc/nginx/certs/proxy.example.com.key;

        if ($request_method = HEAD) {
            return 405;
        }
        error_page 494 =400 @bad_request;

        location / {
            limit_except GET {
                deny all;
            }
            include /etc/nginx/edge-proxy.conf;
            # Keep the rendered relay origin on this edge so API fetches and
            # CSP self stay on port 8443 (the vhost name itself is portless).
            sub_filter_once off;
            sub_filter_types text/html;
            sub_filter "https://proxy.example.com" "https://proxy.example.com:8443";
        }

        location @bad_request {
            return 400;
        }
    }

    # Open-method edges exist only for the POST baseline bench cells.
    server {
        listen 9443 ssl;
        server_name proxy.example.com;

        ssl_certificate     /etc/nginx/certs/proxy.example.com.crt;
        ssl_certificate_key /etc/nginx/certs/proxy.example.com.key;

        error_page 494 =400 @bad_request;

        location / {
            include /etc/nginx/edge-proxy.conf;
            sub_filter_once off;
            sub_filter_types text/html;
            sub_filter "https://proxy.example.com" "https://proxy.example.com:9443";
        }

        location @bad_request {
            return 400;
        }
    }

    server {
        listen 10443 ssl;
        http2 on;
        server_name proxy.example.com;

        ssl_certificate     /etc/nginx/certs/proxy.example.com.crt;
        ssl_certificate_key /etc/nginx/certs/proxy.example.com.key;

        error_page 494 =400 @bad_request;

        location / {
            include /etc/nginx/edge-proxy.conf;
            sub_filter_once off;
            sub_filter_types text/html;
            sub_filter "https://proxy.example.com" "https://proxy.example.com:10443";
        }

        location @bad_request {
            return 400;
        }
    }

    # HTTP parent page at http://127.0.0.1:18000/ that embeds the bridge iframe.
    server {
        listen 18000;
        server_name _;

        if ($request_method = HEAD) {
            return 405;
        }

        location / {
            limit_except GET {
                deny all;
            }
            root /e2e-www;
            try_files /parent.html =404;
        }
    }
}
