# Shared reverse-proxy block for every bench edge variant; included inside
# location / of each server so GET-only and open edges stay identical.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# sub_filter on the bridge page needs an identity-encoded upstream body.
proxy_set_header Accept-Encoding "";
# Fixture client address; the real peer is the browser behind the edge.
proxy_set_header X-Forwarded-For 192.0.2.10;
proxy_buffering off;
proxy_request_buffering off;
proxy_read_timeout 60s;
proxy_send_timeout 60s;
proxy_connect_timeout 10s;
proxy_pass http://telemt_get;
