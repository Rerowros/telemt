<!doctype html>
<meta charset="utf-8" />
<title>telemt GET e2e parent</title>
<script>
  "use strict";
  // Parent page for the GET-carrier browser fixture. It embeds the generated
  // bridge page over the GET-only edge, hands it a MessageChannel port through
  // tproxy-init, then exchanges native WEB frames. All state is exposed on
  // window.__e2e for the Playwright driver; no credentials are logged.
  const params = new URLSearchParams(location.search);
  const BRIDGE_ORIGIN = params.get("origin") || "https://proxy.example.com";
  const CAP = params.get("cap") || "";
  const BASE = params.get("base") || "/";

  const state = {
    status: "init",
    welcome: null,
    frames: [],
    downData: [],
    downBytes: 0,
    traffic: { up: 0, down: 0 },
    closed: false,
    port: null,
    iframe: null,
  };
  window.__e2e = state;

  function decodeFrames(buffer) {
    const u8 = buffer instanceof Uint8Array ? buffer : new Uint8Array(buffer);
    const frames = [];
    let offset = 0;
    while (offset + 8 <= u8.length) {
      const type = u8[offset];
      const sid =
        (u8[offset + 1] << 16) | (u8[offset + 2] << 8) | u8[offset + 3];
      const len =
        ((u8[offset + 4] << 24) |
          (u8[offset + 5] << 16) |
          (u8[offset + 6] << 8) |
          u8[offset + 7]) >>>
        0;
      if (offset + 8 + len > u8.length) break;
      frames.push({
        type,
        sid,
        payload: u8.slice(offset + 8, offset + 8 + len),
      });
      offset += 8 + len;
    }
    return frames;
  }

  function encodeFrame(type, sid, payload) {
    const len = payload ? payload.length : 0;
    const out = new Uint8Array(8 + len);
    out[0] = type;
    out[1] = (sid >> 16) & 255;
    out[2] = (sid >> 8) & 255;
    out[3] = sid & 255;
    out[4] = (len >>> 24) & 255;
    out[5] = (len >>> 16) & 255;
    out[6] = (len >>> 8) & 255;
    out[7] = len & 255;
    if (len) out.set(payload, 8);
    return out;
  }

  state.start = () =>
    new Promise((resolve, reject) => {
      const iframe = document.createElement("iframe");
      iframe.src = BRIDGE_ORIGIN + BASE + "?bridge=" + CAP;
      const timer = setTimeout(
        () => reject(new Error("iframe load timeout")),
        30000,
      );
      iframe.onload = () => {
        clearTimeout(timer);
        const channel = new MessageChannel();
        state.port = channel.port1;
        channel.port1.onmessage = (event) => {
          const data = event.data;
          if (data instanceof ArrayBuffer) {
            if (state.welcome === null) {
              state.welcome = data;
            } else {
              for (const frame of decodeFrames(data)) {
                state.frames.push({
                  type: frame.type,
                  sid: frame.sid,
                  len: frame.payload.length,
                });
                if (frame.type === 2) {
                  state.downBytes += frame.payload.length;
                  state.downData.push(frame.payload);
                }
                state.bench.route(frame);
              }
            }
          } else if (data && data.t === "status") {
            state.status = data.state;
          } else if (data && data.t === "traffic") {
            state.traffic.up += data.up;
            state.traffic.down += data.down;
          } else if (data && data.t === "close") {
            state.closed = true;
          }
        };
        channel.port1.start();
        state.iframe = iframe;
        iframe.contentWindow.postMessage(
          { t: "tproxy-init", v: 1 },
          BRIDGE_ORIGIN,
          [channel.port2],
        );
        resolve();
      };
      document.body.appendChild(iframe);
    });

  state.send = (bytes) => {
    const buffer = bytes instanceof Uint8Array ? bytes.buffer.slice(0) : bytes;
    state.port.postMessage(buffer, [buffer]);
  };
  state.sendFrame = (type, sid, payload) => {
    const bytes = encodeFrame(type, sid, payload);
    state.port.postMessage(bytes.buffer, [bytes.buffer]);
  };
  state.hello = () => state.sendFrame(0x10, 0, new Uint8Array([1]));
  state.open = (sid) => state.sendFrame(0x01, sid, null);
  state.data = (sid, u8) => state.sendFrame(0x02, sid, u8);
  state.closeSession = () => state.port.postMessage({ t: "close" });

  state.waitFor = (fn, timeoutMs) =>
    new Promise((resolve, reject) => {
      const deadline = Date.now() + timeoutMs;
      const tick = () => {
        let value;
        try {
          value = fn();
        } catch (error) {
          value = null;
        }
        if (value) {
          resolve(value);
          return;
        }
        if (Date.now() > deadline) {
          reject(new Error("waitFor timeout"));
          return;
        }
        setTimeout(tick, 50);
      };
      tick();
    });

  state.makePayload = (n) => {
    const u8 = new Uint8Array(n);
    for (let i = 0; i < n; i++) u8[i] = (i * 31 + 7) & 255;
    return u8;
  };
  state.collectData = () => {
    const total = state.downData.reduce((sum, part) => sum + part.length, 0);
    const out = new Uint8Array(total);
    let offset = 0;
    for (const part of state.downData) {
      out.set(part, offset);
      offset += part.length;
    }
    return out;
  };
  state.resetDown = () => {
    state.downData = [];
    state.downBytes = 0;
    state.frames = [];
  };

  // Bench API used by e2e.mjs bench mode: a per-stream frame inbox with
  // waiter routing, sink/source stream markers (see fixture_stream in
  // backend.rs), and WINDOW credit emission so downloads beyond the initial
  // 4 MiB stream window keep flowing like a real client.
  state.bench = (() => {
    const inbox = new Map();
    const waiters = [];
    const pendingCredit = new Map();
    const granted = new Map();
    const CREDIT_CHUNK = 1024 * 1024;
    const SEND_WINDOW = 4 * 1024 * 1024;

    function route(frame) {
      const list = inbox.get(frame.sid) || [];
      list.push(frame);
      inbox.set(frame.sid, list);
      if (frame.type === 4 && frame.payload.length === 4) {
        const amount = new DataView(
          frame.payload.buffer,
          frame.payload.byteOffset,
          4,
        ).getUint32(0);
        granted.set(frame.sid, (granted.get(frame.sid) || 0) + amount);
      }
      for (let i = waiters.length - 1; i >= 0; i--) {
        const waiter = waiters[i];
        if (waiter.sid === frame.sid && !frame.seen && waiter.pred(frame)) {
          waiters.splice(i, 1);
          frame.seen = true;
          clearTimeout(waiter.timer);
          waiter.resolve(frame);
        }
      }
      if (frame.type === 2) {
        const pending =
          (pendingCredit.get(frame.sid) || 0) + frame.payload.length;
        if (pending >= CREDIT_CHUNK) {
          pendingCredit.set(frame.sid, pending - CREDIT_CHUNK);
          const credit = new Uint8Array(4);
          new DataView(credit.buffer).setUint32(0, CREDIT_CHUNK);
          state.sendFrame(0x04, frame.sid, credit);
        } else {
          pendingCredit.set(frame.sid, pending);
        }
      }
    }

    function wait(sid, pred, timeoutMs) {
      return new Promise((resolve, reject) => {
        for (const frame of inbox.get(sid) || []) {
          if (!frame.seen && pred(frame)) {
            frame.seen = true;
            resolve(frame);
            return;
          }
        }
        const waiter = { sid, pred, resolve, timer: null };
        waiter.timer = setTimeout(() => {
          const index = waiters.indexOf(waiter);
          if (index >= 0) waiters.splice(index, 1);
          reject(new Error("bench wait timeout"));
        }, timeoutMs);
        waiters.push(waiter);
      });
    }

    function marker(kind, total) {
      const head = new Uint8Array(9);
      head[0] = kind;
      new DataView(head.buffer).setBigUint64(1, BigInt(total));
      return head;
    }

    // Streams `total` bytes to the sink backend and resolves once its
    // completion ack arrives; the payload stays under the initial window.
    async function upload(sid, total, timeoutMs) {
      state.open(sid);
      const started = performance.now();
      state.data(sid, marker(0x73, total));
      const payload = state.makePayload(total);
      for (let offset = 0; offset < total; offset += 256 * 1024) {
        state.data(sid, payload.subarray(offset, offset + 256 * 1024));
      }
      await wait(sid, (frame) => frame.type === 2, timeoutMs);
      return { bytes: total + 9, ms: performance.now() - started };
    }

    // Pulls `total` deterministic bytes from the source backend, verifies the
    // fixture pattern inline, and reports the first mismatch offset if any.
    async function download(sid, total, timeoutMs) {
      state.open(sid);
      const started = performance.now();
      state.data(sid, marker(0x72, total));
      let received = 0;
      let bad = -1;
      while (received < total) {
        const frame = await wait(sid, (f) => f.type === 2, timeoutMs);
        for (let i = 0; i < frame.payload.length; i++) {
          if (frame.payload[i] !== (((received + i) * 31 + 7) & 255)) {
            bad = received + i;
            break;
          }
        }
        received += frame.payload.length;
      }
      return { bytes: received, ms: performance.now() - started, badByte: bad };
    }

    // Streams `total` fixture bytes to the echo backend honouring the
    // per-stream send window: a client may only carry SEND_WINDOW ungranted
    // payload bytes, so later chunks wait for the WINDOW credits the server
    // emits while the backend drains the stream.
    async function uploadWindowed(sid, total, chunk, timeoutMs) {
      const deadline = performance.now() + timeoutMs;
      const payload = state.makePayload(total);
      const started = performance.now();
      state.open(sid);
      let sent = 0;
      let credit = SEND_WINDOW;
      while (sent < total) {
        credit += granted.get(sid) || 0;
        granted.delete(sid);
        const want = Math.min(chunk, total - sent);
        if (credit < want) {
          const left = deadline - performance.now();
          if (left <= 0) throw new Error("uplink credit timeout");
          await wait(sid, (frame) => frame.type === 4, left);
          continue;
        }
        state.data(sid, payload.subarray(sent, sent + want));
        sent += want;
        credit -= want;
      }
      return { bytes: sent, ms: performance.now() - started };
    }

    // Echo roundtrip of one small frame, `count` sequential iterations.
    async function ping(sid, count, size, timeoutMs) {
      state.open(sid);
      const times = [];
      for (let i = 0; i < count; i++) {
        const payload = new Uint8Array(size);
        payload[0] = 0x65;
        new DataView(payload.buffer).setUint32(1, i);
        const started = performance.now();
        state.data(sid, payload);
        await wait(sid, (frame) => frame.type === 2, timeoutMs);
        times.push(performance.now() - started);
      }
      return times;
    }

    return { route, wait, upload, uploadWindowed, download, ping };
  })();
</script>
<body>
  telemt GET e2e parent
</body>
